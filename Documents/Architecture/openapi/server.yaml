components:
  schemas:
    BootstrapResponse:
      type: object
      properties:
        instance:
          $ref: '#/components/schemas/Instance'
        me:
          allOf:
          - $ref: '#/components/schemas/Profile'
          nullable: true
        real_user:
          allOf:
          - $ref: '#/components/schemas/Profile'
          nullable: true
        view_as:
          allOf:
          - $ref: '#/components/schemas/Subject'
          nullable: true
        permissions:
          $ref: '#/components/schemas/Permissions'
        client:
          $ref: '#/components/schemas/Client'
        nav:
          $ref: '#/components/schemas/Nav'
        default_dashboard:
          allOf:
          - $ref: '#/components/schemas/DefaultDashboard'
          nullable: true
      required:
      - client
      - default_dashboard
      - instance
      - me
      - nav
      - permissions
      - real_user
      - view_as
    Client:
      type: object
      properties:
        ip:
          type: string
        zone:
          allOf:
          - $ref: '#/components/schemas/ZoneRef'
          nullable: true
        zone_source:
          $ref: '#/components/schemas/ZoneSourceEnum'
      required:
      - ip
      - zone
      - zone_source
    DashboardProps:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        scope:
          type: string
        team_ids:
          type: array
          items:
            type: string
        owner_usernames:
          type: array
          items:
            type: string
        always_display:
          type: boolean
        icon:
          type: string
        version:
          type: integer
        can_edit:
          type: boolean
        is_user_default:
          type: boolean
        is_global_default:
          type: boolean
      required:
      - always_display
      - can_edit
      - description
      - icon
      - id
      - is_global_default
      - is_user_default
      - owner_usernames
      - scope
      - team_ids
      - title
      - version
    DashboardViewResponse:
      type: object
      properties:
        dashboard:
          $ref: '#/components/schemas/DashboardProps'
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/Widget'
        items:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ItemView'
        lists:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ListSummary'
        unavailable:
          $ref: '#/components/schemas/Unavailable'
      required:
      - dashboard
      - items
      - lists
      - unavailable
      - widgets
    DefaultDashboard:
      type: object
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/SourceEnum'
      required:
      - id
      - source
    Instance:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
      required:
      - name
      - version
    ItemView:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        protocol:
          type: string
        target:
          type: string
        site:
          type: string
        scope:
          type: string
        zone_names:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        reachable:
          type: boolean
        unreachable_reason:
          type: string
          nullable: true
        launch:
          $ref: '#/components/schemas/Launch'
      required:
      - id
      - launch
      - protocol
      - reachable
      - scope
      - site
      - tags
      - target
      - title
      - unreachable_reason
      - zone_names
    KindEnum:
      enum:
      - OPEN
      - COPY
      - DOWNLOAD
      type: string
      description: |-
        * `OPEN` - OPEN
        * `COPY` - COPY
        * `DOWNLOAD` - DOWNLOAD
    Launch:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        url:
          type: string
        command:
          type: string
        uri:
          type: string
        href:
          type: string
      required:
      - kind
    ListSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        scope:
          type: string
        item_count:
          type: integer
        item_ids:
          type: array
          items:
            type: string
        truncated:
          type: boolean
      required:
      - id
      - item_count
      - item_ids
      - scope
      - title
      - truncated
    LoginRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 512
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        me:
          $ref: '#/components/schemas/Profile'
      required:
      - me
    Nav:
      type: object
      properties:
        dashboards:
          type: array
          items:
            $ref: '#/components/schemas/NavDashboard'
      required:
      - dashboards
    NavDashboard:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        icon:
          type: string
        default:
          type: boolean
        locked:
          type: boolean
      required:
      - default
      - icon
      - id
      - locked
      - title
    OidcProvider:
      type: object
      properties:
        enabled:
          type: boolean
        provider_name:
          type: string
      required:
      - enabled
      - provider_name
    Permissions:
      type: object
      properties:
        global_admin:
          type: boolean
        can_add_global:
          type: boolean
        can_add_team:
          type: boolean
        can_view_as:
          type: boolean
      required:
      - can_add_global
      - can_add_team
      - can_view_as
      - global_admin
    Prefs:
      type: object
      properties:
        density:
          type: string
        theme:
          type: string
        unreachable_policy:
          type: string
      required:
      - density
      - theme
      - unreachable_policy
    Profile:
      type: object
      description: '``me``/``real_user`` (API.md §4.1/§4.2): a user''s own profile,
        as seen by themselves.'
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        auth_source:
          type: string
        prefs:
          $ref: '#/components/schemas/Prefs'
      required:
      - auth_source
      - display_name
      - id
      - prefs
      - username
    ProvidersResponse:
      type: object
      properties:
        instance_name:
          type: string
        local_enabled:
          type: boolean
        ldap_enabled:
          type: boolean
        oidc:
          $ref: '#/components/schemas/OidcProvider'
      required:
      - instance_name
      - ldap_enabled
      - local_enabled
      - oidc
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
      required:
      - results
    SearchResult:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        item:
          allOf:
          - $ref: '#/components/schemas/ItemView'
          nullable: true
      required:
      - id
      - item
      - subtitle
      - title
      - type
    SourceEnum:
      enum:
      - USER
      - SYSTEM_GLOBAL
      - FALLBACK
      type: string
      description: |-
        * `USER` - USER
        * `SYSTEM_GLOBAL` - SYSTEM_GLOBAL
        * `FALLBACK` - FALLBACK
    Subject:
      type: object
      description: The smaller shape used for the ``view_as`` subject.
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
      required:
      - display_name
      - id
      - username
    TypeEnum:
      enum:
      - DASHBOARD
      - ITEM
      - LIST
      type: string
      description: |-
        * `DASHBOARD` - DASHBOARD
        * `ITEM` - ITEM
        * `LIST` - LIST
    Unavailable:
      type: object
      properties:
        items:
          type: array
          items:
            type: string
        lists:
          type: array
          items:
            type: string
      required:
      - items
      - lists
    Widget:
      type: object
      properties:
        id:
          type: string
        widget_type:
          $ref: '#/components/schemas/WidgetTypeEnum'
        title:
          type: string
        grid_x:
          type: integer
        grid_y:
          type: integer
        grid_w:
          type: integer
        grid_h:
          type: integer
        catalog_item_id:
          type: string
          nullable: true
        list_id:
          type: string
          nullable: true
      required:
      - catalog_item_id
      - grid_h
      - grid_w
      - grid_x
      - grid_y
      - id
      - list_id
      - title
      - widget_type
    WidgetTypeEnum:
      enum:
      - HOST
      - LIST
      type: string
      description: |-
        * `HOST` - HOST
        * `LIST` - LIST
    ZoneRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
    ZoneSourceEnum:
      enum:
      - CIDR
      - DEFAULT
      type: string
      description: |-
        * `CIDR` - CIDR
        * `DEFAULT` - DEFAULT
  securitySchemes:
    panicSessionAuth:
      type: apiKey
      in: cookie
      name: panic_sessionid
      description: Session cookie (API.md §1). Unsafe methods also require X-CSRFToken
        matching the panic_csrftoken cookie.
servers:
- url: /api/v1
