  /audit:
    get:
      operationId: audit_retrieve
      description: |-
        ``GET /api/v1/audit?actor=&action=&target_type=&target_id=&q=&since=&until=&limit=&cursor=``.

        Admin-only (F2). ``actor``/``action``/``target_type``+``target_id`` are proper indexed
        filters on ``store.repos.audit.list_audit``; ``q``/``since``/``until`` are applied to the
        already keyset-paged page in Python -- this is an admin diagnostics screen, not a
        payload-budgeted UI read, so a slightly coarser filter pass here is an acceptable trade
        against adding three more indexed query shapes to an append-only, TTL-bounded collection.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
        description: <= 200 (default 50).
      - in: query
        name: q
        schema:
          type: string
        description: Substring match against each entry's summary.
      - in: query
        name: since
        schema:
          type: string
        description: RFC 3339; inclusive lower bound on created_at.
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      - in: query
        name: until
        schema:
          type: string
        description: RFC 3339; inclusive upper bound on created_at.
      tags:
      - audit
      security:
      - panicSessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
