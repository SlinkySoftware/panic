# panic-server on its own, behind panic-web instances elsewhere and using an existing MongoDB:
#   docker compose --env-file /path/to/panic.env -f Build/Containers/compose.standalone.server.yaml up -d
# The env file must set PANIC_MONGO_URI, PANIC_DJANGO_SECRET_KEY, PANIC_ALLOWED_HOSTS and
# PANIC_TRUSTED_PROXY_CIDRS (the panic-web addresses). Every PANIC_* setting: Documents/Operations/CONFIGURATION.md.

name: panic-server

services:
  server:
    image: ${PANIC_IMAGE_PREFIX:-panic-local}/panic-server:${PANIC_IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    env_file: ${PANIC_ENV_FILE:-panic.env}
    environment:
      PANIC_ENV: ${PANIC_ENV:-prod}
      PANIC_MONGO_URI: ${PANIC_MONGO_URI:?set PANIC_MONGO_URI}
    ports:
      - "${PANIC_SERVER_PUBLISH:-8210}:8210"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
