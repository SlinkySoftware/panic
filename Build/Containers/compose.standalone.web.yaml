# panic-web on its own (e.g. in a DMZ), pointing at a panic-server elsewhere:
#   PANIC_SERVER_URL=https://panic-server.example.com:8210 \
#     docker compose -f Build/Containers/compose.standalone.web.yaml up -d
# The server must list this host's address in PANIC_TRUSTED_PROXY_CIDRS to see real client IPs.

name: panic-web

services:
  web:
    image: ${PANIC_IMAGE_PREFIX:-panic-local}/panic-web:${PANIC_IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      PANIC_SERVER_URL: ${PANIC_SERVER_URL:?set PANIC_SERVER_URL to the panic-server origin}
    ports:
      - "${PANIC_WEB_PUBLISH:-8080}:8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
