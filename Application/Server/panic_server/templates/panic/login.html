{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — {{ instance_name }}</title>
  <link rel="stylesheet" href="{% static 'panic/css/app.css' %}?v=7" />
</head>
<body class="body--dark">
  <main class="login">
    <section class="login__card" aria-labelledby="login-title">
      <h1 class="login__title" id="login-title">{{ instance_name }}</h1>
      <p class="login__sub">Portal for Accessing Networks, Infrastructure, and Compute</p>
      {% if error %}<div class="login__error" role="alert" id="login-error">{{ error }}</div>{% endif %}
      {% if password_enabled %}
      <form method="post" action="/login" class="login__form" id="login-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />
        <label class="field-label" for="login-username">Username</label>
        <input class="input" id="login-username" name="username" autocomplete="username" required autofocus value="{{ username }}" />
        <label class="field-label" for="login-password">Password</label>
        <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn btn--primary login__submit">Sign in</button>
      </form>
      {% endif %}
      {% if oidc_enabled %}
      <a class="btn login__sso" id="login-oidc" href="/auth/oidc/login?next={{ next|urlencode }}">Sign in with {{ oidc_provider_name }}</a>
      {% endif %}
    </section>
  </main>
</body>
</html>
