[project]
name = "panic-server"
version = "0.1.2"
description = "PANIC Server: Django control plane, server-rendered UI, REST API, and dynamic .rdp launcher"
requires-python = ">=3.13"
dependencies = [
    "panic-common",
    "django>=5.1,<6.2",
    "djangorestframework>=3.15.0",
    "drf-spectacular>=0.27.0",
    "gunicorn>=22.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "ldap3>=2.9.1",
    "pymongo>=4.9.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["panic_server"]
