# PANIC CI (T-S6-12): Python and web checks, contract drift, Mongo-backed tests, then both images built,
# smoke-tested together (web -> 2x server -> Mongo) and published for main and v* tags:
#   push to main  -> <registry>/<owner>/panic-{web,server}:main and :sha-<short>
#   tag vX.Y.Z    -> <registry>/<owner>/panic-{web,server}:X.Y.Z, :X.Y and :latest
# Registry host and owner come from the server URL and repository, so nothing instance-specific lives
# here. Publishing needs Actions secrets REGISTRY_USER / REGISTRY_TOKEN (write:package): the built-in
# job token cannot push packages.
name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  UV_NO_PROGRESS: "1"
  NO_COLOR: "1"

jobs:
  checks:
    name: python, web, contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Python venv (3.13, workspace + dev group)
        run: uv sync --python 3.13 --group dev

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: Application/Web/package-lock.json

      - name: Web dependencies
        working-directory: Application/Web
        run: npm ci

      - name: MongoDB for the tests (mongo:8)
        run: Build/ci/mongo_service.sh start >> "$GITHUB_ENV"

      - name: Python tests (pytest against Mongo)
        run: ./panic test python

      - name: Python lint (ruff, mypy, import-linter)
        run: ./panic test lint

      - name: Web lint, typecheck, unit tests
        working-directory: Application/Web
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Contract drift (OpenAPI, generated types, nginx template, compose files)
        run: Build/ci/contract_checks.sh

      - name: Stop MongoDB
        if: always()
        run: Build/ci/mongo_service.sh stop

  images:
    name: build, smoke-test, publish images
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve registry, images and tags
        id: meta
        shell: bash
        run: |
          registry="${{ gitea.server_url }}"
          registry="${registry#http://}"
          registry="${registry#https://}"
          registry="${registry%%/*}"
          owner="$(echo "${{ gitea.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          prefix="${registry}/${owner}"
          ref="${{ gitea.ref }}"
          short_sha="$(echo "${{ gitea.sha }}" | cut -c1-7)"
          if [[ "$ref" == refs/tags/v* ]]; then
            version="${ref#refs/tags/v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag must look like v1.2.3 (got ${ref#refs/tags/})" >&2
              exit 1
            fi
            suffixes="${version} ${version%.*} latest"
          else
            version="main-${short_sha}"
            suffixes="main sha-${short_sha}"
          fi
          tags_for() { local t out=""; for t in $suffixes; do out+="${prefix}/$1:${t},"; done; echo "${out%,}"; }
          publish=false
          if [[ "${{ gitea.event_name }}" == "push" || "${{ gitea.event_name }}" == "workflow_dispatch" ]] \
             && [[ "$ref" == refs/heads/main || "$ref" == refs/tags/v* ]]; then
            publish=true
          fi
          {
            echo "registry=${registry}"
            echo "version=${version}"
            echo "web_tags=$(tags_for panic-web)"
            echo "server_tags=$(tags_for panic-server)"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"
          echo "Version: ${version}  Publish: ${publish}"

      - name: Build panic-server (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Build/Containers/server/Containerfile
          load: true
          push: false
          tags: panic-ci/panic-server:smoke

      - name: Build panic-web (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Build/Containers/web/Containerfile
          load: true
          push: false
          tags: panic-ci/panic-web:smoke

      - name: Joint smoke test (web -> 2x server -> Mongo, sign-in, allow-list, XFF, replicas)
        env:
          PANIC_IMAGE_PREFIX: panic-ci
          PANIC_IMAGE_TAG: smoke
        run: Build/ci/container_smoke.sh

      - name: Joint smoke test under a URL prefix (PANIC_BASE_PATH=/panic)
        env:
          PANIC_IMAGE_PREFIX: panic-ci
          PANIC_IMAGE_TAG: smoke
          SMOKE_BASE_PATH: /panic
        run: Build/ci/container_smoke.sh

      # The built-in job token cannot push packages (see header).
      - name: Check registry credentials
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::Set Actions secrets REGISTRY_USER and REGISTRY_TOKEN (a token with write:package) to publish."
            exit 1
          fi

      - name: Login to registry
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Publish panic-server
        if: steps.meta.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Build/Containers/server/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.server_tags }}
          labels: |
            org.opencontainers.image.title=panic-server
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.revision=${{ gitea.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Publish panic-web
        if: steps.meta.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Build/Containers/web/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.web_tags }}
          labels: |
            org.opencontainers.image.title=panic-web
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.revision=${{ gitea.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
