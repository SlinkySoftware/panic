# Release images to GHCR on a version tag (vX.Y.Z):
#   ghcr.io/<owner>/panic-web and panic-server, tagged X.Y.Z; also X.Y when it is the newest patch of that
#   line and latest when it is the newest release overall (by version, not by build order).
# The tag must equal the version in the code. Both images are smoke-tested together (at / and under a URL
# prefix) before anything is pushed, and the pushed images are the ones that were tested.
# Day-to-day CI (checks, :main images) is .gitea/workflows/ci.yaml.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: build, smoke-test, publish images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and image names
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1
          fi
          code="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' Application/Server/panic_server/__init__.py)"
          if [[ "$code" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the code version $code"; exit 1
          fi
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "prefix=ghcr.io/$owner"
          } >> "$GITHUB_OUTPUT"

      - name: Build panic-server
        run: >
          docker build -f Build/Containers/server/Containerfile -t panic-ci/panic-server:smoke
          --label org.opencontainers.image.title=panic-server
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          --label org.opencontainers.image.licenses=GPL-3.0-or-later .

      - name: Build panic-web
        run: >
          docker build -f Build/Containers/web/Containerfile -t panic-ci/panic-web:smoke
          --label org.opencontainers.image.title=panic-web
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          --label org.opencontainers.image.licenses=GPL-3.0-or-later .

      - name: Joint smoke test (web -> 2x server -> Mongo)
        env:
          PANIC_IMAGE_PREFIX: panic-ci
          PANIC_IMAGE_TAG: smoke
        run: Build/ci/container_smoke.sh

      - name: Joint smoke test under a URL prefix (PANIC_BASE_PATH=/panic)
        env:
          PANIC_IMAGE_PREFIX: panic-ci
          PANIC_IMAGE_TAG: smoke
          SMOKE_BASE_PATH: /panic
        run: Build/ci/container_smoke.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        shell: bash
        run: |
          # X.Y.Z always. X.Y and latest only when this is the newest release of its line / overall, so
          # releasing an older line (e.g. 0.2.3 after 0.3.0) or re-running an old tag never moves them back.
          git fetch --quiet --force --tags origin
          version="${{ steps.meta.outputs.version }}"; minor="${{ steps.meta.outputs.minor }}"
          releases="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V)"
          newest="$(tail -n1 <<<"$releases")"
          newest_minor="$(grep -E "^${minor//./\\.}\." <<<"$releases" | tail -n1)"
          tags=("$version")
          [[ "$version" == "$newest_minor" ]] && tags+=("$minor") || echo "::notice::$minor stays on $newest_minor"
          [[ "$version" == "$newest" ]] && tags+=(latest) || echo "::notice::latest stays on $newest"
          for image in panic-server panic-web; do
            for tag in "${tags[@]}"; do
              docker tag "panic-ci/$image:smoke" "${{ steps.meta.outputs.prefix }}/$image:$tag"
              docker push "${{ steps.meta.outputs.prefix }}/$image:$tag"
            done
          done
